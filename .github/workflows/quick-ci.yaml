name: quick-ci

on:
  pull_request:
    branches: [develop]        # develop로 향하는 PR에서 실행
  push:
    branches: ["feature/**"]   # feature/* 브랜치에 push 할 때 실행 (연습용)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Smoke test
        run: |
          echo "Repo: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "✅ CI OK"
